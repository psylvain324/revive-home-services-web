<!doctype html>
<html lang="en">

    <title>Request Received | Revive Co</title>

      img { width: 170px; max-width: 60%; margin: 0 auto 34px; }
      h1 { margin: 0; color: #2e4637; font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: -.04em; }
      p { margin: 20px auto 0; color: #5a7079; line-height: 1.7; }
